<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="estilos/botónregistrarse.css">
</head>
<body>
    <h1>Crear cuenta</h1>
    <form id="registroForm" action="registro.php" method="POST" autocomplete="off">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ejemplo: Juan Carlos"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ ]+" title="Solo letras (incluidas ñ), tildes, diéresis y espacios" required>
        <label for="primer_apellido">Primer apellido:</label>
        <input type="text" id="primer_apellido" name="primer_apellido" placeholder="Ejemplo: De la Torre"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ \-]+" title="Solo letras (incluidas ñ), tildes, diéresis, espacios y guiones"
            required>
        <label for="segundo_apellido">Segundo apellido:</label>
        <input type="text" id="segundo_apellido" name="segundo_apellido" placeholder="Ejemplo: San Martín"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ \-]+" title="Solo letras (incluidas ñ), tildes, diéresis, espacios y guiones"
            required>
        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ejemplo: juan123"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ0-9_]{4,20}" title="Entre 4 y 20 caracteres." required>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="usuario@gmail.com"
            pattern="[a-zA-Z0-9._%+\-]+@(gmail|hotmail|yahoo|outlook|icloud|msn)\.(com|es|org|net)"
            title="Introduce un correo válido con un dominio conocido (ej. @gmail.com, @hotmail.es, @yahoo.com, ...)"
            required>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
            pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="Mínimo 8 caracteres, al menos una letra y un número" required>
        <label for="password_confirm">Repetir contraseña:</label>
        <input type="password" id="password_confirm" name="password_confirm" placeholder="Repite tu contraseña"
            required>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        <label for="prefijo">Prefijo telefónico:</label>
        <select id="prefijo" name="prefijo" required>
            <option value="">Seleccionar prefijo</option>
            <option value="+34">España (+34)</option>
            <option value="+33">Francia (+33)</option>
            <option value="+351">Portugal (+351)</option>
            <option value="+39">Italia (+39)</option>
            <option value="+49">Alemania (+49)</option>
            <option value="+44">Reino Unido (+44)</option>
            <option value="+54">Argentina (+54)</option>
            <option value="+52">México (+52)</option>
            <option value="+57">Colombia (+57)</option>
            <option value="+56">Chile (+56)</option>
            <option value="+51">Perú (+51)</option>
        </select>
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="600123456" pattern="[0-9]{9}" inputmode="numeric"
            title="Introduce 9 números" required>
        <label for="codigo_postal">Código postal:</label>
        <input type="text" id="codigo_postal" name="codigo_postal" placeholder="22001" pattern="[0-9]{5}"
            inputmode="numeric" title="Introduce 5 números" required>
        <label for="nombre_via">Nombre de la vía:</label>
        <input type="text" id="nombre_via" name="nombre_via" placeholder="Ejemplo: Calle 12 de Octubre"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ0-9 \-\.]+" title="Permite letras, números, espacios, puntos y guiones"
            required>
        <label for="numero">Número:</label>
        <input type="text" id="numero" name="numero" placeholder="Ejemplo: 12" pattern="[0-9]+" inputmode="numeric"
            title="Solo se permiten números" required>
        <label for="piso">Piso:</label>
        <input type="text" id="piso" name="piso" placeholder="Ejemplo: 3º">
        <label for="puerta">Puerta:</label>
        <input type="text" id="puerta" name="puerta" placeholder="Ejemplo: B">
        <label for="pais">País:</label>
        <select id="pais" name="pais" required>
            <option value="">Seleccionar país</option>
            <option value="España">España</option>
            <option value="Francia">Francia</option>
            <option value="Portugal">Portugal</option>
            <option value="Italia">Italia</option>
            <option value="Alemania">Alemania</option>
            <option value="Reino Unido">Reino Unido</option>
            <option value="Argentina">Argentina</option>
            <option value="México">México</option>
            <option value="Colombia">Colombia</option>
            <option value="Chile">Chile</option>
            <option value="Perú">Perú</option>
        </select>
        <button type="submit">Crear cuenta</button>
    </form>
    <script>
        const form = document.getElementById('registroForm');
        form.addEventListener('submit', (e) => {
            // Añade la clase .validado para activar los bordes rojos en los campos :invalid de CSS
            form.classList.add('validado');
            // Comprobación personalizada para verificar si las contraseñas coinciden
            const pass = document.getElementById('password');
            const passConfirm = document.getElementById('password_confirm');
            if (pass.value !== passConfirm.value) {
                passConfirm.setCustomValidity('Las contraseñas no coinciden');
            } else {
                passConfirm.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
